<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap | MOTO.BUYA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-dark zp-navbar">
    <div class="container">
      <a class="navbar-brand" href="../index.html">MOTO<span class="zp-brand-dot">-</span>BUYA</a>
    </div>
  </nav>

  <main class="flex-grow-1 d-flex align-items-center zp-section py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="zp-card p-4 p-md-5">
            <h1 class="h3 text-center mb-1">Tekrar Hoş Geldiniz</h1>
            <p class="text-muted text-center mb-4">Hesabınıza giriş yapın</p>

            <form class="needs-validation" novalidate>
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="girisEmail" placeholder="ornek@eposta.com" required>
                <label for="girisEmail">E-posta adresi</label>
                <div class="invalid-feedback">Lütfen geçerli bir e-posta girin.</div>
              </div>

              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="girisSifre" placeholder="Şifre" required minlength="6">
                <label for="girisSifre">Şifre</label>
                <div class="invalid-feedback">Şifre en az 6 karakter olmalı.</div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="beniHatirla">
                  <label class="form-check-label small" for="beniHatirla">Beni hatırla</label>
                </div>
                <a href="#" class="small">Şifremi unuttum</a>
              </div>

              <button class="btn zp-btn-primary w-100 py-2" type="submit">Giriş Yap</button>
            </form>

            <hr class="my-4">
            <p class="text-center small mb-0">Hesabınız yok mu? <a href="kayit.html">Hemen kaydolun</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="zp-footer py-3">
    <div class="container text-center small text-white-50">&copy; 2026 MOTO.BUYA-egerzz</div>
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
